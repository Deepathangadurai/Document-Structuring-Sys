services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    env_file: .env
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Healthcheck runs inside the qdrant container, so check localhost.
      # Use bash and raw TCP/HTTP to avoid relying on curl/wget in the qdrant image.
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /collections HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \"HTTP/1.1 200\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11435:11434"

  gotenberg:
    # Containerized LibreOffice-over-HTTP conversion service. Used for
    # docx -> pdf (page images, page-accurate text) instead of shelling
    # out to a soffice binary installed on the host, so a corrupted host
    # LibreOffice install (e.g. a broken bootstrap.ini) can't take down
    # document conversion - every request gets a fresh container.
    # https://gotenberg.dev
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Override the localhost-pointed values from .env (correct for
      # running the backend directly on the host) with the Docker network's
      # service names - env_file is loaded first and `environment:` here
      # takes precedence over it, so this doesn't require maintaining a
      # separate .env.docker. Inside this container "localhost" means the
      # backend container itself, not these sibling containers.
      QDRANT_URL: http://qdrant:6333
      # Use the Compose-network Ollama service, not the host-only alias.
      # This is the real backend-to-Ollama endpoint inside Docker.
      MODEL_URL: http://ollama:11434
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - ./backend:/app
      - ./templates:/templates
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_started
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
      gotenberg:
        condition: service_started
    ports:
      - "${BACKEND_PORT}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # frontend/.env (volume-mounted into this container) hardcodes
      # BACKEND_URL=http://localhost:8000 for local dev. Vite's loadEnv
      # picks that file up from the container's cwd unless a real process
      # env var overrides it - which is what this does. Without it, the
      # dev server's /api and /static proxies would try to reach
      # "localhost:8000" from inside the frontend container, which is the
      # frontend container itself, not the backend one.
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_storage:
  frontend_node_modules:
  ollama_models:  